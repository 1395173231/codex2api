name: Security Scan

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
      - codex/**
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CHANGELOG.md'
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Create frontend dist placeholder
        run: mkdir -p frontend/dist && touch frontend/dist/placeholder

      # PR/push 钉死扫描器版本,避免工具本身行为漂移。漏洞库仍是实时的。
      # 周一定时任务改用 @latest,专门抓新 advisory。
      - name: Run govulncheck
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            go install golang.org/x/vuln/cmd/govulncheck@latest
          else
            go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          fi
          govulncheck ./...

  frontend-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run npm audit
        working-directory: frontend
        # 等价于 npm audit --omit=dev --audit-level=high,额外支持逐条 advisory
        # 的例外白名单(理由与复查时间写在脚本里)。
        run: node scripts/audit-gate.mjs
